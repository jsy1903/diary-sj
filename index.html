<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SJ Daily Diary</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f1117;--surface:#161b27;--card:#1e2535;
  --border:rgba(255,255,255,0.1);--border2:rgba(255,255,255,0.18);
  --text:#e2dfd0;--muted:#8892a4;
  --teal:#1D9E75;--teal-l:rgba(29,158,117,0.15);
  --blue:#3b82f6;--blue-l:rgba(59,130,246,0.15);
  --amber:#d97706;--amber-l:rgba(217,119,6,0.15);
  --purp:#7c3aed;--purp-l:rgba(124,58,237,0.15);
  --coral:#e11d48;
  --radius:12px;--radius-sm:8px;
}
html{background:var(--bg)}
body{font-family:'Noto Sans KR',sans-serif;color:var(--text);background:var(--bg);min-height:100vh;max-width:480px;margin:0 auto;padding-bottom:80px}
*,*::before,*::after{box-sizing:border-box}
.header{position:sticky;top:0;z-index:50;background:var(--bg);border-bottom:1px solid var(--border);padding:14px 16px 10px}
.header-year{font-size:11px;color:var(--muted);margin-bottom:2px}
.header-date{font-size:20px;font-weight:700}
.header-week{font-size:11px;color:var(--muted);margin-top:3px}
.content{padding:12px 16px}
.card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px}
.sec-title{font-size:13px;font-weight:500;padding-left:10px;margin-bottom:12px;display:flex;align-items:center;justify-content:space-between}
.row{display:flex;align-items:center;gap:8px}
.row-between{display:flex;align-items:center;justify-content:space-between}
input,textarea,select{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--text);font-family:'Noto Sans KR',sans-serif;font-size:13px;padding:8px 10px;width:100%;outline:none;transition:border-color 0.2s}
input:focus,textarea:focus{border-color:var(--teal)}
input[type="number"]{-moz-appearance:textfield}
input[type="number"]::-webkit-outer-spin-button,input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}
textarea{resize:vertical;min-height:80px;line-height:1.6}
input[type="date"]{width:auto}
.lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.btn{border:none;cursor:pointer;font-family:'Noto Sans KR',sans-serif;font-size:13px;font-weight:500;border-radius:var(--radius-sm);padding:8px 14px;transition:opacity 0.2s,transform 0.1s;display:inline-flex;align-items:center;gap:5px}
.btn:active{transform:scale(0.97)}
.btn:disabled{opacity:0.5;cursor:not-allowed}
.btn-sm{font-size:11px;padding:4px 10px}
.btn-full{width:100%;justify-content:center;padding:13px;font-size:15px;border-radius:var(--radius)}
.btn-outline{background:transparent;border:1px solid var(--border2);color:var(--muted)}
.btn-ghost{background:var(--teal-l);color:var(--teal);border:1px solid var(--teal);font-size:12px;padding:4px 12px}
.btn-teal{background:var(--teal);color:#fff}
.btn-blue{background:var(--blue);color:#fff}
.chk{width:26px;height:26px;border-radius:50%;cursor:pointer;border:1px solid var(--border2);background:var(--surface);font-size:12px;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:background 0.2s}
.chk.done{background:var(--teal);border-color:var(--teal);color:#fff}
.pbar-wrap{height:6px;background:var(--border);border-radius:3px;overflow:hidden;flex:1}
.pbar-fill{height:100%;border-radius:3px;transition:width 0.4s ease}
.pill{font-size:11px;font-weight:500;padding:2px 8px;border-radius:20px;white-space:nowrap}
.ex-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:8px}
.stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.stat-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px 12px}
.stat-lbl{font-size:11px;color:var(--muted);margin-bottom:4px}
.stat-val{font-size:22px;font-weight:700}
.week-grid{width:100%;border-collapse:collapse;font-size:11px}
.week-grid td{text-align:center;padding:5px 2px}
.row-label{text-align:left;color:var(--muted);padding-right:4px}
.dot{width:9px;height:9px;border-radius:50%;margin:0 auto}
.sched-item{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;margin-bottom:6px;display:flex;align-items:center;justify-content:space-between}
.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:480px;background:var(--surface);border-top:1px solid var(--border);display:flex;z-index:100}
.nav-btn{flex:1;border:none;background:none;padding:9px 0 7px;color:var(--muted);font-size:9px;font-family:'Noto Sans KR',sans-serif;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px;border-top:2px solid transparent}
.nav-btn.active{color:var(--teal);border-top-color:var(--teal)}
.nav-icon{font-size:14px;line-height:1}
.save-msg{margin-top:8px;padding:10px 12px;font-size:12px;line-height:1.5;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-sm);color:var(--muted)}
.save-msg.ok{border-color:var(--teal);color:var(--teal)}
.save-msg.err{border-color:#ef4444;color:#ef4444}
.divider{height:1px;background:var(--border);margin:10px 0}
.empty{text-align:center;color:var(--muted);font-size:13px;padding:8px 0 12px}
.setup-banner{background:rgba(217,119,6,0.1);border:1px solid var(--amber);border-radius:var(--radius-sm);padding:10px 12px;margin-bottom:12px;font-size:12px;color:var(--amber);line-height:1.6}
.achieve-big{font-size:52px;font-weight:700;line-height:1;margin:6px 0 4px}
.period-tabs{display:flex;gap:0;margin-bottom:14px;background:var(--surface);border-radius:var(--radius-sm);padding:3px}
.period-tab{flex:1;border:none;background:none;color:var(--muted);font-size:12px;font-family:'Noto Sans KR',sans-serif;padding:7px 0;border-radius:6px;cursor:pointer}
.period-tab.active{background:var(--teal);color:#fff;font-weight:500}
.chart-wrap{position:relative;height:210px;margin-bottom:8px}
.ar{margin-bottom:11px}
.ar-label{display:flex;justify-content:space-between;margin-bottom:5px;font-size:12px}
</style>
</head>
<body>
<script>const SCRIPT_URL="";</script>
<div id="app"></div>
<script>
const DKR=['일','월','화','수','목','금','토'];
const now=new Date();
function fmtDate(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekStart(d=new Date()){const dt=new Date(d);dt.setHours(0,0,0,0);const dw=dt.getDay();dt.setDate(dt.getDate()-(dw===0?6:dw-1));return fmtDate(dt)}
function monthKey(d=new Date()){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`}
const TODAY=fmtDate(now),WK=weekStart(now),MNTH=monthKey(now),YR=String(now.getFullYear());

const stor={
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch{return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}
};

const newEx=()=>({id:Math.random().toString(36).slice(2),name:'',weight:'',sets:'',reps:''});
const defLog=()=>({exercises:[],running:{km:'',min:'',sec:''},study:{topic:'',min:''},reading:{book:'',pages:''},memo:'',done:{ex:false,run:false,study:false,read:false}});
const defWeek=()=>({goals:{exDays:5,runKm:20,studyMin:300,readPages:100},schedule:[]});

let state={
  tab:'today',
  log:stor.get(`log:${TODAY}`)||defLog(),
  weekData:stor.get(`week:${WK}`)||defWeek(),
  summary:stor.get(`summary:${WK}`)||{study:'',book:''},
  settings:stor.get('sj_settings')||{curBook:'',scriptUrl:''},
  weekLogs:{},saving:false,saveMsg:'',saveMsgType:'',
  editingGoals:false,statPeriod:'week',
};
if(state.settings.scriptUrl)window._SU=state.settings.scriptUrl;
const getUrl=()=>SCRIPT_URL||window._SU||'';

function loadWeekLogs(){
  const wl={},sd=new Date(WK+'T00:00:00');
  for(let i=0;i<7;i++){const d=new Date(sd);d.setDate(sd.getDate()+i);const dk=fmtDate(d);const dl=stor.get(`log:${dk}`);if(dl)wl[dk]=dl}
  state.weekLogs=wl;
}
loadWeekLogs();

function saveLog(){stor.set(`log:${TODAY}`,state.log);state.weekLogs[TODAY]=state.log}

function calcProg(wl){
  let exDays=0,runKm=0,studyMin=0,readPages=0;
  Object.values(wl).forEach(l=>{
    if((l.exercises&&l.exercises.length>0)||l.done?.ex)exDays++;
    runKm+=parseFloat(l.running?.km||0);
    studyMin+=parseFloat(l.study?.min||0);
    readPages+=parseFloat(l.reading?.pages||0);
  });
  return{exDays,runKm,studyMin,readPages};
}

function calcAc(prog,goals){
  const ex=goals.exDays>0?Math.min(100,Math.round(prog.exDays/goals.exDays*100)):0;
  const run=goals.runKm>0?Math.min(100,Math.round(prog.runKm/goals.runKm*100)):0;
  const study=goals.studyMin>0?Math.min(100,Math.round(prog.studyMin/goals.studyMin*100)):0;
  const read=goals.readPages>0?Math.min(100,Math.round(prog.readPages/goals.readPages*100)):0;
  const avg=Math.round((ex+run+study+read)/4);
  return{ex,run,study,read,avg};
}

function saveWeekAchieve(){
  const prog=calcProg(state.weekLogs);
  const ac=calcAc(prog,state.weekData.goals);
  stor.set(`achieve:${WK}`,{weekStart:WK,month:MNTH,year:YR,...ac});
  // 월간 평균
  const allKeys=Object.keys(localStorage);
  const wks=allKeys.filter(k=>k.startsWith('achieve:')).map(k=>stor.get(k)).filter(v=>v&&v.month===MNTH);
  if(wks.length){const avg=f=>Math.round(wks.reduce((s,w)=>s+w[f],0)/wks.length);stor.set(`m_achieve:${MNTH}`,{month:MNTH,year:YR,ex:avg('ex'),run:avg('run'),study:avg('study'),read:avg('read'),avg:avg('avg')})}
  // 연간 평균
  const mths=allKeys.filter(k=>k.startsWith('m_achieve:')).map(k=>stor.get(k)).filter(v=>v&&v.year===YR);
  if(mths.length){const avg=f=>Math.round(mths.reduce((s,m)=>s+m[f],0)/mths.length);stor.set(`y_achieve:${YR}`,{year:YR,ex:avg('ex'),run:avg('run'),study:avg('study'),read:avg('read'),avg:avg('avg')})}
}

// 그래프 데이터
function getChartData(){
  const labels=[],exA=[],runA=[],studyA=[],readA=[],avgA=[];
  if(state.statPeriod==='week'){
    const sd=new Date(WK+'T00:00:00');
    for(let i=11;i>=0;i--){const d=new Date(sd);d.setDate(d.getDate()-i*7);const wk=fmtDate(d);const ac=stor.get(`achieve:${wk}`);labels.push(`${d.getMonth()+1}/${d.getDate()}`);exA.push(ac?ac.ex:null);runA.push(ac?ac.run:null);studyA.push(ac?ac.study:null);readA.push(ac?ac.read:null);avgA.push(ac?ac.avg:null)}
  }else if(state.statPeriod==='month'){
    for(let i=11;i>=0;i--){const t=new Date(now.getFullYear(),now.getMonth()-i,1);const mk=monthKey(t);const ac=stor.get(`m_achieve:${mk}`);labels.push(`${String(t.getFullYear()).slice(2)}/${t.getMonth()+1}`);exA.push(ac?ac.ex:null);runA.push(ac?ac.run:null);studyA.push(ac?ac.study:null);readA.push(ac?ac.read:null);avgA.push(ac?ac.avg:null)}
  }else{
    for(let y=2025;y<=now.getFullYear();y++){const ac=stor.get(`y_achieve:${y}`);labels.push(`${y}년`);exA.push(ac?ac.ex:null);runA.push(ac?ac.run:null);studyA.push(ac?ac.study:null);readA.push(ac?ac.read:null);avgA.push(ac?ac.avg:null)}
  }
  return{labels,exA,runA,studyA,readA,avgA};
}

async function apiCall(action,payload){
  const url=getUrl();
  if(!url)return{ok:false,error:'설정 탭에서 Apps Script URL을 입력해주세요'};
  try{const enc=encodeURIComponent(JSON.stringify({action,payload}));await fetch(`${url}?data=${enc}`,{method:'GET',mode:'no-cors'});return{ok:true,message:'Google Sheets에 저장 완료 ✓'}}
  catch(e){return{ok:false,error:e.message}}
}
async function saveTodayToSheets(){
  state.saving=true;state.saveMsg='';render();
  const r=await apiCall('saveDaily',{date:TODAY,exercises:state.log.exercises,running:state.log.running,study:state.log.study,reading:state.log.reading,memo:state.log.memo});
  state.saving=false;state.saveMsg=r.ok?r.message:'✗ '+r.error;state.saveMsgType=r.ok?'ok':'err';render();
}
async function saveSummaryToSheets(){
  const prog=calcProg(state.weekLogs);const ac=calcAc(prog,state.weekData.goals);
  saveWeekAchieve();
  state.saving=true;state.saveMsg='';render();
  const r=await apiCall('saveSummary',{weekStart:WK,stats:prog,achieve:ac,studyNotes:state.summary.study,bookReview:state.summary.book});
  state.saving=false;state.saveMsg=r.ok?r.message:'✗ '+r.error;state.saveMsgType=r.ok?'ok':'err';render();
}

let chartInst=null;
function render(){
  document.getElementById('app').innerHTML=html();
  bind();
  if(state.tab==='stats')setTimeout(drawChart,60);
}

function acColor(v){return v>=80?'var(--teal)':v>=50?'var(--amber)':'var(--coral)'}

function html(){
  const wkDisp=`${parseInt(WK.slice(5,7))}월 ${parseInt(WK.slice(8))}일 주`;
  const tabs=[{k:'today',i:'◈',l:'오늘'},{k:'week',i:'◎',l:'이번주'},{k:'summary',i:'◇',l:'주간요약'},{k:'stats',i:'▲',l:'통계'},{k:'settings',i:'≡',l:'설정'}];
  return `
<div class="header">
  <div class="header-year">${now.getFullYear()}년</div>
  <div class="header-date">${now.getMonth()+1}월 ${now.getDate()}일 (${DKR[now.getDay()]})</div>
  <div class="header-week">이번주: ${wkDisp}~</div>
</div>
<div class="content">
  ${!getUrl()?'<div class="setup-banner">⚠️ 설정 탭에서 Google Apps Script URL을 등록해주세요.</div>':''}
  ${state.tab==='today'?htmlToday():''}
  ${state.tab==='week'?htmlWeek():''}
  ${state.tab==='summary'?htmlSummary():''}
  ${state.tab==='stats'?htmlStats():''}
  ${state.tab==='settings'?htmlSettings():''}
</div>
<nav class="nav">
  ${tabs.map(t=>`<button class="nav-btn${state.tab===t.k?' active':''}" data-tab="${t.k}"><span class="nav-icon">${t.i}</span>${t.l}</button>`).join('')}
</nav>`;
}

function htmlToday(){
  const l=state.log;
  const prog=calcProg(state.weekLogs);
  const ac=calcAc(prog,state.weekData.goals);
  return `
<div class="card" style="padding:12px 14px">
  <div class="row-between" style="margin-bottom:10px">
    <span style="font-size:12px;color:var(--muted)">이번주 달성률</span>
    <span style="font-size:22px;font-weight:700;color:${acColor(ac.avg)}">${ac.avg}%</span>
  </div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:4px">
    ${[['💪',ac.ex,'var(--teal)'],['🏃',ac.run,'var(--blue)'],['📈',ac.study,'var(--amber)'],['📚',ac.read,'var(--purp)']].map(([ic,v,c])=>`<div style="text-align:center;background:var(--surface);border-radius:8px;padding:6px 0"><div style="font-size:16px;font-weight:700;color:${c}">${v}%</div><div style="font-size:9px;color:var(--muted);margin-top:1px">${ic}</div></div>`).join('')}
  </div>
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--teal);padding-left:10px;color:var(--teal)">💪 웨이트 트레이닝<button class="btn btn-ghost" id="addEx">+ 추가</button></div>
  ${l.exercises.length===0?'<div class="empty">운동을 추가해주세요</div>':''}
  ${l.exercises.map((ex,i)=>`<div class="ex-card"><div class="row-between" style="margin-bottom:8px"><span style="font-size:11px;color:var(--muted)">운동 ${i+1}</span><button class="btn btn-sm btn-outline" data-delex="${ex.id}">삭제</button></div><input class="ex-name" data-exid="${ex.id}" placeholder="운동명 (예: 벤치프레스)" value="${esc(ex.name)}" style="margin-bottom:6px"><div class="row"><div style="flex:1"><div class="lbl">무게(kg)</div><input type="number" class="ex-w" data-exid="${ex.id}" placeholder="80" value="${esc(ex.weight)}"></div><div style="flex:1"><div class="lbl">세트</div><input type="number" class="ex-s" data-exid="${ex.id}" placeholder="3" value="${esc(ex.sets)}"></div><div style="flex:1"><div class="lbl">횟수</div><input type="number" class="ex-r" data-exid="${ex.id}" placeholder="10" value="${esc(ex.reps)}"></div></div></div>`).join('')}
  <div class="row-between" style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)"><span style="font-size:12px;color:var(--muted)">오늘 운동 완료</span><div class="chk${l.done.ex?' done':''}" data-tog="ex">✓</div></div>
</div>
<div class="card">
  <div class="sec-title row-between" style="border-left:3px solid var(--blue);padding-left:10px;color:var(--blue)">🏃 달리기<div class="chk${l.done.run?' done':''}" data-tog="run">✓</div></div>
  <div class="row"><div style="flex:1"><div class="lbl">거리(km)</div><input type="number" id="runKm" placeholder="5" value="${esc(l.running.km)}"></div><div style="flex:1"><div class="lbl">분</div><input type="number" id="runMin" placeholder="30" value="${esc(l.running.min)}"></div><div style="flex:1"><div class="lbl">초</div><input type="number" id="runSec" placeholder="15" value="${esc(l.running.sec)}"></div></div>
</div>
<div class="card">
  <div class="sec-title row-between" style="border-left:3px solid var(--amber);padding-left:10px;color:var(--amber)">📈 주식 공부<div class="chk${l.done.study?' done':''}" data-tog="study">✓</div></div>
  <div style="margin-bottom:8px"><div class="lbl">공부 주제</div><input id="studyTopic" placeholder="예: PLTR 실적 분석, AMZN 밸류에이션" value="${esc(l.study.topic)}"></div>
  <div><div class="lbl">공부 시간 (분)</div><input type="number" id="studyMin" placeholder="45" value="${esc(l.study.min)}"></div>
</div>
<div class="card">
  <div class="sec-title row-between" style="border-left:3px solid var(--purp);padding-left:10px;color:var(--purp)">📚 독서<div class="chk${l.done.read?' done':''}" data-tog="read">✓</div></div>
  <div style="margin-bottom:8px"><div class="lbl">책 제목</div><input id="readBook" placeholder="${esc(state.settings.curBook)||'책 제목을 입력하세요'}" value="${esc(l.reading.book)}"></div>
  <div><div class="lbl">읽은 페이지 수</div><input type="number" id="readPages" placeholder="30" value="${esc(l.reading.pages)}"></div>
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--muted);padding-left:10px;color:var(--muted)">📝 오늘의 메모</div>
  <textarea id="memo" placeholder="오늘 느낀점, 특이사항, 내일 할일...">${esc(l.memo)}</textarea>
</div>
<button class="btn btn-full btn-teal" id="saveTodayBtn" ${state.saving?'disabled':''}>${state.saving?'저장 중...':'📊 Google Sheets에 저장하기'}</button>
${state.saveMsg?`<div class="save-msg ${state.saveMsgType}">${state.saveMsg}</div>`:''}`;
}

function htmlWeek(){
  const prog=calcProg(state.weekLogs),g=state.weekData.goals,ac=calcAc(prog,g);
  const weekDays=[];const sd=new Date(WK+'T00:00:00');
  for(let i=0;i<7;i++){const d=new Date(sd);d.setDate(sd.getDate()+i);weekDays.push({date:fmtDate(d),label:DKR[d.getDay()],day:d.getDate()})}
  const rows=[
    {key:'ex',label:'운동',unit:'일',actual:prog.exDays,goal:g.exDays,gkey:'exDays',color:'var(--teal)',bg:'var(--teal-l)',ac:ac.ex},
    {key:'run',label:'달리기',unit:'km',actual:parseFloat(prog.runKm.toFixed(1)),goal:g.runKm,gkey:'runKm',color:'var(--blue)',bg:'var(--blue-l)',ac:ac.run},
    {key:'study',label:'공부',unit:'분',actual:prog.studyMin,goal:g.studyMin,gkey:'studyMin',color:'var(--amber)',bg:'var(--amber-l)',ac:ac.study},
    {key:'read',label:'독서',unit:'p',actual:prog.readPages,goal:g.readPages,gkey:'readPages',color:'var(--purp)',bg:'var(--purp-l)',ac:ac.read},
  ];
  const dotDone=(dl,k)=>{if(!dl)return false;if(k==='ex')return(dl.exercises&&dl.exercises.length>0)||dl.done?.ex;if(k==='run')return parseFloat(dl.running?.km||0)>0||dl.done?.run;if(k==='study')return parseFloat(dl.study?.min||0)>0||dl.done?.study;return parseFloat(dl.reading?.pages||0)>0||dl.done?.read};
  return `
<div class="card" style="text-align:center;padding:20px 14px">
  <div style="font-size:12px;color:var(--muted);margin-bottom:4px">이번주 평균 달성률</div>
  <div class="achieve-big" style="color:${acColor(ac.avg)}">${ac.avg}%</div>
  <div style="font-size:11px;color:var(--muted)">${WK} 기준</div>
</div>
<div class="card">
  <div class="sec-title row-between" style="border-left:3px solid var(--teal);padding-left:10px;color:var(--teal)">이번주 진도<button class="btn btn-sm btn-outline" id="toggleGoals">${state.editingGoals?'완료':'목표 설정'}</button></div>
  ${rows.map(r=>`<div class="ar"><div class="ar-label"><span>${r.label}</span><div class="row" style="gap:8px">${state.editingGoals?`<input type="number" class="goal-input" data-gkey="${r.gkey}" value="${r.goal}" style="width:55px;text-align:right;font-size:12px">`:''}<span style="color:var(--muted);font-size:11px">${r.actual}${r.unit}/${r.goal}${r.unit}</span><span class="pill" style="background:${r.bg};color:${r.color}">${r.ac}%</span></div></div><div class="pbar-wrap"><div class="pbar-fill" style="width:${r.ac}%;background:${r.color}"></div></div></div>`).join('')}
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--teal);padding-left:10px;color:var(--teal)">요일별 현황</div>
  <table class="week-grid"><thead><tr><td style="width:40px"></td>${weekDays.map(d=>`<td style="color:${d.date===TODAY?'var(--teal)':'var(--muted)'};font-weight:${d.date===TODAY?700:400}"><div>${d.label}</div><div style="font-size:10px">${d.day}</div></td>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr><td class="row-label">${r.label}</td>${weekDays.map(d=>`<td><div class="dot" style="background:${dotDone(state.weekLogs[d.date],r.key)?r.color:'var(--border2)'}"></div></td>`).join('')}</tr>`).join('')}</tbody></table>
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--amber);padding-left:10px;color:var(--amber)">주요 일정</div>
  ${(state.weekData.schedule||[]).length===0?'<div class="empty">등록된 일정이 없습니다</div>':''}
  ${(state.weekData.schedule||[]).map(ev=>`<div class="sched-item"><div><div style="font-size:11px;color:var(--amber);margin-bottom:2px">${ev.date.slice(5,7)}월 ${parseInt(ev.date.slice(8))}일 (${DKR[new Date(ev.date+'T00:00:00').getDay()]})</div><div style="font-size:13px">${esc(ev.text)}</div></div><button class="btn btn-sm btn-outline" data-delev="${ev.id}">삭제</button></div>`).join('')}
  <div class="divider"></div>
  <div class="row" style="gap:6px"><input type="date" id="newEvDate" value="${TODAY}" style="width:130px;font-size:12px"><input id="newEvText" placeholder="일정 내용" style="flex:1"><button class="btn btn-ghost" id="addEvBtn" style="height:36px;padding:0 12px;flex-shrink:0">추가</button></div>
</div>`;
}

function htmlSummary(){
  const prog=calcProg(state.weekLogs),ac=calcAc(prog,state.weekData.goals),s=state.summary;
  const topics=Object.entries(state.weekLogs).filter(([,l])=>l.study?.topic);
  const books=[...new Set(Object.values(state.weekLogs).filter(l=>l.reading?.book).map(l=>l.reading.book))];
  return `
<div class="card" style="text-align:center;padding:20px 14px">
  <div style="font-size:12px;color:var(--muted);margin-bottom:4px">이번주 최종 달성률</div>
  <div class="achieve-big" style="color:${acColor(ac.avg)}">${ac.avg}%</div>
  <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:14px">
    ${[['💪 운동',ac.ex,'var(--teal)'],['🏃 달리기',ac.run,'var(--blue)'],['📈 공부',ac.study,'var(--amber)'],['📚 독서',ac.read,'var(--purp)']].map(([l,v,c])=>`<div><div style="font-size:18px;font-weight:700;color:${c}">${v}%</div><div style="font-size:10px;color:var(--muted);margin-top:2px">${l}</div></div>`).join('')}
  </div>
</div>
<div class="stats-grid">
  ${[['운동',`${prog.exDays}일`,'var(--teal)'],['달리기',`${prog.runKm.toFixed(1)}km`,'var(--blue)'],['공부',`${prog.studyMin}분`,'var(--amber)'],['독서',`${prog.readPages}p`,'var(--purp)']].map(([l,v,c])=>`<div class="stat-card"><div class="stat-lbl">${l}</div><div class="stat-val" style="color:${c}">${v}</div></div>`).join('')}
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--amber);padding-left:10px;color:var(--amber)">📊 이번주 공부 정리</div>
  ${topics.length>0?`<div style="margin-bottom:10px">${topics.map(([date,l])=>`<div style="font-size:12px;color:var(--muted);margin-bottom:3px"><span style="color:var(--amber)">${date.slice(5,7)}월${parseInt(date.slice(8))}일</span> ${esc(l.study.topic)}${l.study.min?` (${l.study.min}분)`:''}</div>`).join('')}</div>`:''}
  <div class="lbl">핵심 인사이트, 배운 점, 투자 아이디어</div>
  <textarea id="sumStudy" placeholder="이번주 공부 정리..." style="min-height:110px">${esc(s.study)}</textarea>
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--blue);padding-left:10px;color:var(--blue)">📚 독서 감상문</div>
  ${books.length>0?`<div style="margin-bottom:10px">${books.map(b=>`<span style="font-size:11px;background:var(--blue-l);color:var(--blue);padding:2px 8px;border-radius:20px;display:inline-block;margin-right:6px;margin-bottom:4px">${esc(b)}</span>`).join('')}<div style="font-size:11px;color:var(--muted);margin-top:4px">총 ${prog.readPages}페이지</div></div>`:''}
  <div class="lbl">인상 깊은 내용, 적용할 점, 나만의 생각</div>
  <textarea id="sumBook" placeholder="독서 감상문..." style="min-height:110px">${esc(s.book)}</textarea>
</div>
<button class="btn btn-full btn-blue" id="saveSumBtn" ${state.saving?'disabled':''}>${state.saving?'저장 중...':'📊 주간 요약 + 달성률 저장'}</button>
${state.saveMsg?`<div class="save-msg ${state.saveMsgType}">${state.saveMsg}</div>`:''}`;
}

function htmlStats(){
  const tw=stor.get(`achieve:${WK}`),tm=stor.get(`m_achieve:${MNTH}`),ty=stor.get(`y_achieve:${YR}`);
  const cur=state.statPeriod==='week'?tw:state.statPeriod==='month'?tm:ty;
  return `
<div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:12px">
  ${[['이번주',tw,WK.slice(5)+'~'],['이번달',tm,MNTH.slice(5)+'월'],['올해',ty,YR+'년']].map(([l,ac,sub])=>`<div class="stat-card" style="text-align:center"><div class="stat-lbl">${l}</div><div style="font-size:28px;font-weight:700;color:${!ac?'var(--muted)':acColor(ac.avg)};line-height:1.2;margin:4px 0">${ac?ac.avg+'%':'--'}</div><div style="font-size:10px;color:var(--muted)">${sub}</div></div>`).join('')}
</div>
<div class="period-tabs">
  <button class="period-tab${state.statPeriod==='week'?' active':''}" data-period="week">주간 12주</button>
  <button class="period-tab${state.statPeriod==='month'?' active':''}" data-period="month">월간 12개월</button>
  <button class="period-tab${state.statPeriod==='year'?' active':''}" data-period="year">연간</button>
</div>
<div class="card">
  <div style="display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px">
    ${[['#1D9E75','운동'],['#3b82f6','달리기'],['#d97706','공부'],['#7c3aed','독서'],['#8892a4','평균']].map(([c,l])=>`<div style="display:flex;align-items:center;gap:4px;font-size:11px;color:var(--muted)"><div style="width:8px;height:8px;border-radius:50%;background:${c}"></div>${l}</div>`).join('')}
  </div>
  <div class="chart-wrap"><canvas id="mainChart"></canvas></div>
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--teal);padding-left:10px;color:var(--teal)">${state.statPeriod==='week'?'이번주':state.statPeriod==='month'?'이번달':'올해'} 항목별 달성률</div>
  ${cur?[['💪 운동',cur.ex,'var(--teal)'],['🏃 달리기',cur.run,'var(--blue)'],['📈 공부',cur.study,'var(--amber)'],['📚 독서',cur.read,'var(--purp)']].map(([l,v,c])=>`<div class="ar"><div class="ar-label"><span>${l}</span><span style="font-weight:500;color:${c}">${v}%</span></div><div class="pbar-wrap"><div class="pbar-fill" style="width:${v}%;background:${c}"></div></div></div>`).join(''):'<div class="empty">저장된 데이터가 없습니다<br><span style="font-size:11px">주간요약 탭 → 저장 버튼을 누르면 자동 기록됩니다</span></div>'}
</div>`;
}

function htmlSettings(){
  const s=state.settings,g=state.weekData.goals;
  return `
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--teal);padding-left:10px;color:var(--teal)">Google Apps Script URL</div>
  <div class="lbl">저장 후 브라우저에 기억됩니다</div>
  <input id="scriptUrlInput" placeholder="https://script.google.com/macros/s/..." value="${esc(s.scriptUrl||SCRIPT_URL)}">
  <button class="btn btn-ghost" id="saveUrlBtn" style="margin-top:8px;width:100%;justify-content:center">URL 저장</button>
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--teal);padding-left:10px;color:var(--teal)">현재 읽고 있는 책</div>
  <input id="curBookInput" placeholder="책 제목 (독서 섹션 기본값)" value="${esc(s.curBook)}">
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--amber);padding-left:10px;color:var(--amber)">주간 기본 목표</div>
  ${[['운동 일수','exDays','일/주'],['달리기','runKm','km/주'],['주식 공부','studyMin','분/주'],['독서','readPages','페이지/주']].map(([l,k,u])=>`<div class="row-between" style="margin-bottom:10px"><div><span style="font-size:13px">${l}</span><span style="font-size:11px;color:var(--muted);margin-left:6px">${u}</span></div><input type="number" class="goal-input-sett" data-gkey="${k}" value="${g[k]}" style="width:70px;text-align:right"></div>`).join('')}
</div>
<div class="card">
  <div class="sec-title" style="border-left:3px solid var(--muted);padding-left:10px;color:var(--muted)">앱 정보</div>
  <p style="font-size:12px;color:var(--muted);line-height:1.8">SJ Daily Diary v2.0<br>데이터: 브라우저 localStorage 자동 저장<br>달성률: 주간요약 저장 시 자동 기록<br>GitHub: jsy1903.github.io/sj-diary</p>
</div>`;
}

function drawChart(){
  const canvas=document.getElementById('mainChart');
  if(!canvas)return;
  if(chartInst){chartInst.destroy();chartInst=null}
  const{labels,exA,runA,studyA,readA,avgA}=getChartData();
  const ds=(data,color,dash=[])=>({data,borderColor:color,backgroundColor:color+'22',pointBackgroundColor:color,pointRadius:3,pointHoverRadius:5,tension:0.3,spanGaps:true,borderWidth:dash.length?1.5:2,borderDash:dash});
  chartInst=new Chart(canvas,{
    type:'line',
    data:{labels,datasets:[ds(exA,'#1D9E75'),ds(runA,'#3b82f6'),ds(studyA,'#d97706'),ds(readA,'#7c3aed'),ds(avgA,'#8892a4',[4,3])]},
    options:{
      responsive:true,maintainAspectRatio:false,
      plugins:{legend:{display:false},tooltip:{mode:'index',intersect:false,backgroundColor:'#1e2535',titleColor:'#e2dfd0',bodyColor:'#8892a4',borderColor:'rgba(255,255,255,0.1)',borderWidth:1,callbacks:{label:ctx=>{const names=['운동','달리기','공부','독서','평균'];return `${names[ctx.datasetIndex]}: ${ctx.parsed.y!=null?ctx.parsed.y+'%':'데이터없음'}`}}}},
      scales:{x:{grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#8892a4',font:{size:10}}},y:{min:0,max:100,grid:{color:'rgba(255,255,255,0.05)'},ticks:{color:'#8892a4',font:{size:10},callback:v=>v+'%'}}},
      interaction:{mode:'nearest',axis:'x',intersect:false},
    }
  });
}

function bind(){
  document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>{state.tab=b.dataset.tab;state.saveMsg='';render()}));
  document.querySelectorAll('[data-period]').forEach(b=>b.addEventListener('click',()=>{state.statPeriod=b.dataset.period;render()}));

  if(state.tab==='today'){
    document.getElementById('addEx')?.addEventListener('click',()=>{state.log.exercises.push(newEx());saveLog();render()});
    document.querySelectorAll('[data-delex]').forEach(b=>b.addEventListener('click',()=>{state.log.exercises=state.log.exercises.filter(e=>e.id!==b.dataset.delex);saveLog();render()}));
    document.querySelectorAll('.ex-name').forEach(i=>i.addEventListener('input',()=>{const e=state.log.exercises.find(e=>e.id===i.dataset.exid);if(e)e.name=i.value;saveLog()}));
    document.querySelectorAll('.ex-w').forEach(i=>i.addEventListener('input',()=>{const e=state.log.exercises.find(e=>e.id===i.dataset.exid);if(e)e.weight=i.value;saveLog()}));
    document.querySelectorAll('.ex-s').forEach(i=>i.addEventListener('input',()=>{const e=state.log.exercises.find(e=>e.id===i.dataset.exid);if(e)e.sets=i.value;saveLog()}));
    document.querySelectorAll('.ex-r').forEach(i=>i.addEventListener('input',()=>{const e=state.log.exercises.find(e=>e.id===i.dataset.exid);if(e)e.reps=i.value;saveLog()}));
    document.getElementById('runKm')?.addEventListener('input',e=>{state.log.running.km=e.target.value;saveLog()});
    document.getElementById('runMin')?.addEventListener('input',e=>{state.log.running.min=e.target.value;saveLog()});
    document.getElementById('runSec')?.addEventListener('input',e=>{state.log.running.sec=e.target.value;saveLog()});
    document.getElementById('studyTopic')?.addEventListener('input',e=>{state.log.study.topic=e.target.value;saveLog()});
    document.getElementById('studyMin')?.addEventListener('input',e=>{state.log.study.min=e.target.value;saveLog()});
    document.getElementById('readBook')?.addEventListener('input',e=>{state.log.reading.book=e.target.value;saveLog()});
    document.getElementById('readPages')?.addEventListener('input',e=>{state.log.reading.pages=e.target.value;saveLog()});
    document.getElementById('memo')?.addEventListener('input',e=>{state.log.memo=e.target.value;saveLog()});
    document.querySelectorAll('[data-tog]').forEach(b=>b.addEventListener('click',()=>{state.log.done[b.dataset.tog]=!state.log.done[b.dataset.tog];saveLog();render()}));
    document.getElementById('saveTodayBtn')?.addEventListener('click',saveTodayToSheets);
  }
  if(state.tab==='week'){
    document.getElementById('toggleGoals')?.addEventListener('click',()=>{state.editingGoals=!state.editingGoals;render()});
    document.querySelectorAll('.goal-input').forEach(i=>i.addEventListener('input',()=>{state.weekData.goals[i.dataset.gkey]=parseFloat(i.value)||0;stor.set(`week:${WK}`,state.weekData)}));
    document.getElementById('addEvBtn')?.addEventListener('click',()=>{
      const date=document.getElementById('newEvDate').value,text=document.getElementById('newEvText').value.trim();
      if(!text)return;
      state.weekData.schedule.push({id:Math.random().toString(36).slice(2),date,text});
      state.weekData.schedule.sort((a,b)=>a.date.localeCompare(b.date));
      stor.set(`week:${WK}`,state.weekData);render();
    });
    document.querySelectorAll('[data-delev]').forEach(b=>b.addEventListener('click',()=>{state.weekData.schedule=state.weekData.schedule.filter(e=>e.id!==b.dataset.delev);stor.set(`week:${WK}`,state.weekData);render()}));
  }
  if(state.tab==='summary'){
    document.getElementById('sumStudy')?.addEventListener('input',e=>{state.summary.study=e.target.value;stor.set(`summary:${WK}`,state.summary)});
    document.getElementById('sumBook')?.addEventListener('input',e=>{state.summary.book=e.target.value;stor.set(`summary:${WK}`,state.summary)});
    document.getElementById('saveSumBtn')?.addEventListener('click',saveSummaryToSheets);
  }
  if(state.tab==='settings'){
    document.getElementById('saveUrlBtn')?.addEventListener('click',()=>{const url=document.getElementById('scriptUrlInput').value.trim();state.settings.scriptUrl=url;window._SU=url;stor.set('sj_settings',state.settings);alert('저장되었습니다!')});
    document.getElementById('curBookInput')?.addEventListener('input',e=>{state.settings.curBook=e.target.value;stor.set('sj_settings',state.settings)});
    document.querySelectorAll('.goal-input-sett').forEach(i=>i.addEventListener('input',()=>{state.weekData.goals[i.dataset.gkey]=parseFloat(i.value)||0;stor.set(`week:${WK}`,state.weekData)}));
  }
}

function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}

render();
</script>
</body>
</html>
